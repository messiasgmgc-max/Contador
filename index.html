<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Controle Financeiro Semanal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!--
      Tela branca é o pior erro possível: não diz o que houve. Qualquer falha
      antes do React montar (o caso comum é um build publicado sem
      VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY) vira uma mensagem legível.
    -->
    <script>
      (function () {
        function mostrarFalha(msg) {
          var root = document.getElementById('root');
          if (!root || root.getAttribute('data-booted') === '1') return;
          root.innerHTML =
            '<div style="font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;max-width:34rem;' +
            'margin:15vh auto;padding:1.5rem;border:1px solid #fecdd3;background:#fff1f2;' +
            'border-radius:1rem;color:#881337">' +
            '<strong style="display:block;margin-bottom:.5rem">O app não conseguiu iniciar</strong>' +
            '<p style="margin:0 0 .75rem">Se esta é uma versão publicada (site, .exe ou APK), o build ' +
            'provavelmente saiu sem as variáveis VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY. ' +
            'Configure as duas no ambiente e gere o build de novo.</p>' +
            '<code style="display:block;white-space:pre-wrap;word-break:break-word;font-size:12px;' +
            'background:#fff;border:1px solid #fecdd3;border-radius:.5rem;padding:.5rem">' +
            String(msg).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) +
            '</code></div>';
        }
        window.addEventListener('error', function (e) { mostrarFalha(e.message || e.error); });
        window.addEventListener('unhandledrejection', function (e) { mostrarFalha(e.reason); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
