name: Build Android APK & Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar dependências
        run: npm ci

      # Sem estas duas o bundle sai sem Supabase e o APK abre em branco.
      # Cadastre-as em Settings > Secrets and variables > Actions.
      - name: Conferir as variáveis do Supabase
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Faltam os secrets VITE_SUPABASE_URL e/ou VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Gerar build web do projeto
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sincronizar Capacitor com a pasta mobile
        run: npx cap sync

      - name: Dar permissão de execução ao Gradle
        run: chmod +x ./mobile/gradlew

      - name: Compilar APK Debug
        run: cd mobile && ./gradlew assembleDebug

      - name: Renomear APK para FluxoFinanceiro.apk
        run: cp mobile/app/build/outputs/apk/debug/app-debug.apk ./FluxoFinanceiro.apk

      - name: Upload do APK gerado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxoFinanceiro-Android-APK
          path: ./FluxoFinanceiro.apk
          retention-days: 30
